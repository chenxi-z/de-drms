<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" font-family="Noto Sans CJK SC">
<rect width="1100" height="850" fill="white"/>
<text x="35" y="40" font-size="27" fill="#1a1a1a">两电极四线制接法</text>
<text x="35" y="70" font-size="14" fill="#556070">四根引线、两个电极 · 电极接触阻抗仍属于被测系统</text>
<rect x="35" y="180" width="280" height="150" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="206" font-size="15" fill="#1a1a1a">仪器 CN4</text>
<text x="47" y="231" font-size="15" fill="#1a1a1a">1：I_OUTPUT / Force+</text>
<text x="47" y="256" font-size="15" fill="#1a1a1a">2：V_P / Sense+</text>
<text x="47" y="281" font-size="15" fill="#1a1a1a">3：V_N / Sense−</text>
<text x="47" y="306" font-size="15" fill="#1a1a1a">4：I_INPUT / Force−</text>
<rect x="775" y="180" width="290" height="150" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="787" y="206" font-size="15" fill="#1a1a1a">样品两个电极</text>
<text x="787" y="231" font-size="15" fill="#1a1a1a">正电极：Force+与Sense+</text>
<text x="787" y="256" font-size="15" fill="#1a1a1a">在电极根部独立汇合</text>
<text x="787" y="281" font-size="15" fill="#1a1a1a">负电极：Sense−与Force−</text>
<text x="787" y="306" font-size="15" fill="#1a1a1a">在另一电极根部独立汇合</text>
<line class="w" x1="315" y1="230" x2="775" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="315" y1="255" x2="775" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="315" y1="280" x2="775" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="315" y1="305" x2="775" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="420" width="1030" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="446" font-size="15" fill="#1a1a1a">四线模式：板上Force/Sense短接电阻R32/R33不贴，四条独立引线直到样品电极根部</text>
<text x="47" y="471" font-size="15" fill="#1a1a1a">二线模式：R32/R33可贴0 Ω，只引两根线；引线压降进入测量值</text>
<text x="35" y="625" font-size="18" fill="#1F4FD8">图注与自查要点</text>
<text x="35" y="655" font-size="14" fill="#556070">Kelvin接法减小Force引线压降影响，不能消除两电极本身与样品的界面阻抗。</text>
<text x="35" y="681" font-size="14" fill="#556070">高阻Sense线避开数字时钟、写卡与SMPS回流；漏电、清洁度、屏蔽接法均需实物验证。</text>
<text x="35" y="707" font-size="14" fill="#556070">未来CPE扫频测得的是偏置点附近整个两电极系统的复阻抗，不能直接等同材料本征参数。</text>
</svg>
