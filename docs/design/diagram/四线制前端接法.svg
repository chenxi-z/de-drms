<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" font-family="Noto Sans CJK SC">
<rect width="1100" height="850" fill="white"/>
<text x="35" y="40" font-size="27" fill="#1a1a1a">四线制前端接法</text>
<text x="35" y="70" font-size="14" fill="#556070">测量通道与电流通道 · 物理AIN1/2与仿真CH0/1对应</text>
<rect x="35" y="145" width="340" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="171" font-size="15" fill="#1a1a1a">样品 Sense+：V_P</text>
<text x="47" y="196" font-size="15" fill="#1a1a1a">样品 Sense−：经U10选AFE_M</text>
<text x="47" y="221" font-size="15" fill="#1a1a1a">两路分别经过OPA388缓冲</text>
<rect x="665" y="145" width="400" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="677" y="171" font-size="15" fill="#1a1a1a">T2差分AAF → ADS131A02</text>
<text x="677" y="196" font-size="15" fill="#1a1a1a">AIN1P / AIN1N = 样品电压</text>
<text x="677" y="221" font-size="15" fill="#1a1a1a">对应仿真 CH0</text>
<line class="w" x1="375" y1="195" x2="665" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="335" width="340" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="361" font-size="15" fill="#1a1a1a">Rsense顶端：AFE_B → OPA388</text>
<text x="47" y="386" font-size="15" fill="#1a1a1a">Rsense底端：Kelvin地直连RC</text>
<text x="47" y="411" font-size="15" fill="#1a1a1a">低阻地端不增加运放</text>
<rect x="665" y="335" width="400" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="677" y="361" font-size="15" fill="#1a1a1a">T2差分AAF → ADS131A02</text>
<text x="677" y="386" font-size="15" fill="#1a1a1a">AIN2P / AIN2N = 电流检测电压</text>
<text x="677" y="411" font-size="15" fill="#1a1a1a">对应仿真 CH1</text>
<line class="w" x1="375" y1="385" x2="665" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="530" width="1030" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="556" font-size="15" fill="#1a1a1a">直流：去除有效偏置后的 Vsample / Vsense × Rsense，再应用有效的参考校准系数</text>
<text x="47" y="581" font-size="15" fill="#1a1a1a">两通道同步采样；校准/切换/恢复/过载期间的数据必须标记无效</text>
<text x="35" y="675" font-size="18" fill="#1F4FD8">图注与自查要点</text>
<text x="35" y="705" font-size="14" fill="#556070">两通道负载结构并非完全相同；不能从RC镜像直接宣称整机高共模抑制或交流相位匹配。</text>
<text x="35" y="731" font-size="14" fill="#556070">T2元件和两线连接见抗混叠滤波电路图；板上寄生与ADC真实负载仍需验证。</text>
<text x="35" y="757" font-size="14" fill="#556070">图示为连接说明，未替代最终EDA网表、PCB检查与实物校准。</text>
</svg>
