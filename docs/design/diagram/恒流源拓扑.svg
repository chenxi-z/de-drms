<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"
     font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
  .w   { stroke:#374151; stroke-width:2;   fill:none }
  .wr  { stroke:#374151; stroke-width:2.5; fill:none }
  .sym { stroke:#374151; stroke-width:1.8; fill:none; stroke-linejoin:round }
  .p   { stroke:#7c3aed; stroke-width:1.8; fill:none; stroke-dasharray:6,4 }
  .gw  { stroke:#059669; stroke-width:3.5; fill:none }
  .ow  { stroke:#ea580c; stroke-width:3.5; fill:none }
  .gd  { stroke:#9ca3af; stroke-width:2;   fill:none; stroke-dasharray:5,4 }
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20,0 L0,0 0,20" fill="none" stroke="#eef2f7" stroke-width="1"/>
  </pattern>
  <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#059669"/></marker>
  <marker id="arrO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrK" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#374151"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="800" fill="url(#grid)"/>

<!-- ===== title ===== -->
<text x="40" y="46" font-size="22" font-weight="bold" fill="#111827">恒流源拓扑</text>
<text x="40" y="72" font-size="12.5" fill="#64748b">OPA333 + BSS138 低边恒流源 · 8 uA · Rsense 150 kOhm</text>
<text x="1160" y="46" font-size="12" fill="#94a3b8" text-anchor="end">附录 E.2 · 2026-10-14</text>

<!-- ===== VSET divider ===== -->
<text x="100" y="120" font-size="13" font-weight="bold" fill="#059669">3.3V_A</text>
<line x1="100" y1="130" x2="100" y2="160" class="gw"/>
<rect x="86" y="160" width="28" height="50" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="120" y="180" font-size="12" font-weight="bold" fill="#111827">R1</text>
<text x="120" y="195" font-size="10" fill="#64748b">10 kOhm</text>
<line x1="100" y1="210" x2="100" y2="240" class="w"/>
<circle cx="100" cy="240" r="4.5" fill="#111827"/>
<rect x="86" y="240" width="28" height="50" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="120" y="260" font-size="12" font-weight="bold" fill="#111827">R2</text>
<text x="120" y="275" font-size="10" fill="#64748b">10 kOhm</text>
<line x1="100" y1="290" x2="100" y2="320" class="w"/>
<line x1="84" y1="320" x2="116" y2="320" stroke="#374151" stroke-width="2.5" fill="none"/>
<line x1="90" y1="326" x2="110" y2="326" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="96" y1="332" x2="104" y2="332" stroke="#374151" stroke-width="2" fill="none"/>
<text x="140" y="235" font-size="12" font-weight="bold" fill="#059669">VSET</text>
<text x="140" y="250" font-size="10" fill="#64748b">~ 1.65 V</text>

<!-- ===== OPA333 ===== -->
<rect x="280" y="180" width="140" height="120" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="350" y="205" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">OPA333</text>
<text x="350" y="225" font-size="11" fill="#64748b" text-anchor="middle">零漂移运放</text>
<text x="350" y="245" font-size="10" fill="#64748b" text-anchor="middle">Iq 50 uA</text>
<text x="350" y="265" font-size="10" fill="#059669" text-anchor="middle">-&gt; 3.3V_A</text>
<text x="350" y="285" font-size="9" fill="#94a3b8" text-anchor="middle">V_os +/-5 uV typ</text>
<line x1="100" y1="240" x2="280" y2="240" class="w"/>
<text x="190" y="230" font-size="10" fill="#059669" text-anchor="middle">VSET</text>

<!-- ===== BSS138 ===== -->
<rect x="520" y="180" width="120" height="120" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="2"/>
<text x="580" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">BSS138</text>
<text x="580" y="225" font-size="11" fill="#64748b" text-anchor="middle">NMOS</text>
<text x="580" y="245" font-size="10" fill="#64748b" text-anchor="middle">V_th 1.0-1.8 V</text>
<text x="580" y="265" font-size="10" fill="#64748b" text-anchor="middle">R_ds(on) 1.6 Ohm</text>
<text x="580" y="285" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">I_D = 8 uA</text>
<line x1="420" y1="240" x2="520" y2="240" class="w"/>
<text x="470" y="230" font-size="10" fill="#64748b" text-anchor="middle">Gate</text>

<!-- ===== Rsense ===== -->
<rect x="740" y="180" width="140" height="120" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="2"/>
<text x="810" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Rsense</text>
<text x="810" y="225" font-size="12" fill="#64748b" text-anchor="middle">150 kOhm 0.1%</text>
<text x="810" y="245" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">V_Rsense = 1.2 V</text>
<text x="810" y="265" font-size="10" fill="#64748b" text-anchor="middle">(8 uA x 150 kOhm)</text>
<text x="810" y="285" font-size="10" fill="#059669" text-anchor="middle">-&gt; ADC AIN1</text>
<line x1="640" y1="240" x2="740" y2="240" class="w"/>
<text x="690" y="230" font-size="10" fill="#64748b" text-anchor="middle">Drain</text>

<!-- ===== current path ===== -->
<line x1="880" y1="240" x2="960" y2="240" class="gw"/>
<text x="920" y="230" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">I = 8 uA</text>
<line x1="960" y1="240" x2="1020" y2="240" class="gw" marker-end="url(#arrG)"/>
<text x="990" y="230" font-size="10" fill="#64748b" text-anchor="middle">到样品</text>

<!-- ===== CURR_DIS ===== -->
<rect x="520" y="380" width="120" height="60" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
<text x="580" y="400" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">CURR_DIS</text>
<text x="580" y="418" font-size="11" fill="#64748b" text-anchor="middle">PB10</text>
<text x="580" y="435" font-size="10" fill="#64748b" text-anchor="middle">高 = 关断</text>
<line x1="580" y1="380" x2="580" y2="300" class="w"/>
<text x="590" y="340" font-size="9" fill="#94a3b8">BSS138 关断</text>

<!-- ===== work modes ===== -->
<rect x="60" y="480" width="400" height="120" rx="2" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
<text x="75" y="500" font-size="13" font-weight="bold" fill="#111827">工作模式</text>
<text x="75" y="520" font-size="11" fill="#059669">测量模式：CURR_DIS = 0（低）-&gt; BSS138 导通 -&gt; 8 uA 恒流</text>
<text x="75" y="538" font-size="11" fill="#64748b">零点模式：CURR_DIS = 1（高）-&gt; BSS138 关断 -&gt; 0 uA</text>
<text x="75" y="556" font-size="11" fill="#64748b">复位/高阻默认：CURR_DIS = 0（内部下拉）-&gt; 开启</text>
<text x="75" y="574" font-size="10" fill="#94a3b8">I_set 由 VSET 分压设定，V_Rsense = I x Rsense = 1.2 V</text>

<!-- ===== key params ===== -->
<rect x="500" y="480" width="400" height="120" rx="2" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
<text x="515" y="500" font-size="13" font-weight="bold" fill="#111827">关键参数</text>
<text x="515" y="520" font-size="11" fill="#111827">恒流精度：取决于 VSET 分压精度 + Rsense 0.1%</text>
<text x="515" y="538" font-size="11" fill="#059669">V_Rsense = 1.2 V &lt; 2.442 V（ADC 基准，裕量充足）</text>
<text x="515" y="556" font-size="11" fill="#111827">合规栈：V_sample + V_Rsense + 管压降 &lt;= T 点电压 - 0.5 V</text>
<text x="515" y="574" font-size="10" fill="#94a3b8">T 点偏置：R_top 10 kOhm / R_b 150 kOhm -&gt; T ~ 2.97 V</text>

<!-- ===== notes ===== -->
<text x="60" y="640" font-size="13" font-weight="bold" fill="#111827">图注与自查要点：</text>
<text x="60" y="665" font-size="11" fill="#374151">1. 低边拓扑：恒流源在样品地侧，样品压降 T 点经跟随器进 ADC AIN0</text>
<text x="60" y="685" font-size="11" fill="#374151">2. VSET 由 3.3V_A 经 R1/R2 分压，OPA333 缓冲后驱动 BSS138 gate</text>
<text x="60" y="705" font-size="11" fill="#374151">3. Rsense 压降 1.2 V 直接进 ADC AIN1（不经跟随器，低阻源）</text>
<text x="60" y="725" font-size="11" fill="#374151">4. CURR_DIS=1 关断恒流源用于零点模式，消除 ADC 失调</text>
<text x="60" y="745" font-size="11" fill="#374151">5. 8 uA 选择依据：3.3 V 轨合规电压（非'用满 2.442 V 基准'）</text>
</svg>
