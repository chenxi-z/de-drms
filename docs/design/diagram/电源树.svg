<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"
     font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
  .w   { stroke:#374151; stroke-width:2;   fill:none }
  .wr  { stroke:#374151; stroke-width:2.5; fill:none }
  .sym { stroke:#374151; stroke-width:1.8; fill:none; stroke-linejoin:round }
  .p   { stroke:#7c3aed; stroke-width:1.8; fill:none; stroke-dasharray:6,4 }
  .gw  { stroke:#059669; stroke-width:3.5; fill:none }
  .ow  { stroke:#ea580c; stroke-width:3.5; fill:none }
  .gd  { stroke:#9ca3af; stroke-width:2;   fill:none; stroke-dasharray:5,4 }
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20,0 L0,0 0,20" fill="none" stroke="#eef2f7" stroke-width="1"/>
  </pattern>
  <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#059669"/></marker>
  <marker id="arrO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrK" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#374151"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1500" height="900" fill="url(#grid)"/>

<!-- ===== title ===== -->
<text x="40" y="46" font-size="22" font-weight="bold" fill="#111827">电源树</text>
<text x="40" y="72" font-size="12.5" fill="#64748b">1S 锂电 + BQ24040 + 双 LDO（数字 25nA 常开 / 模拟 6.5uA EN 受控）</text>
<text x="1460" y="46" font-size="12" fill="#94a3b8" text-anchor="end">附录 E.8 · 2026-10-14</text>

<!-- ===== USB ===== -->
<rect x="80" y="120" width="140" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="150" y="148" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">USB Type-C</text>
<text x="150" y="170" font-size="12" fill="#64748b" text-anchor="middle">5V VBUS</text>

<!-- ===== BQ24040 ===== -->
<rect x="80" y="220" width="140" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="150" y="248" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">BQ24040</text>
<text x="150" y="270" font-size="12" fill="#64748b" text-anchor="middle">充电管理</text>
<line x1="150" y1="190" x2="150" y2="220" class="wr"/>
<text x="185" y="308" font-size="10" fill="#64748b">ISET: PB4</text>
<text x="185" y="322" font-size="9" fill="#94a3b8">(500mA/1A)</text>

<!-- ===== battery ===== -->
<rect x="80" y="340" width="140" height="80" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="150" y="365" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">1S 锂电</text>
<text x="150" y="385" font-size="12" fill="#64748b" text-anchor="middle">3.0-4.2 V</text>
<text x="150" y="402" font-size="10" fill="#94a3b8" text-anchor="middle">103450 带保护板</text>
<line x1="150" y1="290" x2="150" y2="340" class="wr"/>
<text x="150" y="440" font-size="10" fill="#2563eb" text-anchor="middle">PC0 VBAT_MON</text>
<text x="150" y="455" font-size="9" fill="#94a3b8" text-anchor="middle">(2x1MOhm 分压)</text>

<!-- ===== distribution ===== -->
<circle cx="310" cy="380" r="4.5" fill="#111827"/>
<line x1="220" y1="380" x2="310" y2="380" class="wr"/>
<text x="232" y="362" font-size="11" font-weight="bold" fill="#111827">电池节点</text>

<!-- ===== digital LDO ===== -->
<rect x="340" y="160" width="200" height="120" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="440" y="185" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">TPS7A0233</text>
<text x="440" y="210" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">3.3V_D 数字域</text>
<text x="440" y="235" font-size="11" fill="#64748b" text-anchor="middle">Iq 25 nA · 常开</text>
<text x="440" y="255" font-size="10" fill="#94a3b8" text-anchor="middle">200 mA · +/-1.5%</text>
<line x1="310" y1="380" x2="310" y2="220" class="w"/>
<line x1="310" y1="220" x2="340" y2="220" class="w" style="stroke:#2563eb;stroke-width:2.5"/>

<!-- ===== analog LDO ===== -->
<rect x="340" y="320" width="200" height="120" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
<text x="440" y="345" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">TPS7A2033</text>
<text x="440" y="370" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">3.3V_A 模拟域</text>
<text x="440" y="395" font-size="11" fill="#64748b" text-anchor="middle">Iq 6.5 uA · 7 uVrms</text>
<text x="440" y="415" font-size="10" fill="#94a3b8" text-anchor="middle">300 mA · +/-1.5%</text>
<text x="440" y="432" font-size="10" fill="#64748b" text-anchor="middle">EN: PB12 (ANA_EN)</text>
<line x1="310" y1="380" x2="310" y2="380" class="w"/>
<line x1="310" y1="380" x2="340" y2="380" class="gw"/>

<!-- ===== digital loads ===== -->
<rect x="660" y="160" width="300" height="120" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="810" y="182" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">数字域负载</text>
<text x="810" y="206" font-size="11" fill="#111827" text-anchor="middle">STM32U575 (13.5 mA@160MHz)</text>
<text x="810" y="224" font-size="11" fill="#111827" text-anchor="middle">ADS131A02 IOVDD (0.6 mA)</text>
<text x="810" y="242" font-size="11" fill="#111827" text-anchor="middle">TMP117 + USB + LED (峰值 ~30 mA)</text>
<text x="810" y="260" font-size="11" fill="#111827" text-anchor="middle">TMUX SEL 逻辑 (漏电 &lt;= 50 pA)</text>
<text x="810" y="275" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">总负载 &lt; 50 mA</text>
<line x1="540" y1="220" x2="660" y2="220" class="w" style="stroke:#2563eb;stroke-width:2.5"/>

<!-- ===== analog loads ===== -->
<rect x="660" y="320" width="300" height="120" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="810" y="342" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">模拟域负载</text>
<text x="810" y="366" font-size="11" fill="#111827" text-anchor="middle">ADS131A02 AVDD (3.2 mA typ)</text>
<text x="810" y="384" font-size="11" fill="#111827" text-anchor="middle">OPA388 x3 跟随器 (1.7-2.6 mA 每颗)</text>
<text x="810" y="402" font-size="11" fill="#111827" text-anchor="middle">OPA333 恒流源运放 (0.05 mA)</text>
<text x="810" y="420" font-size="11" fill="#111827" text-anchor="middle">TMUX 模拟侧 + VSET + R_top/R_b</text>
<text x="810" y="435" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">总负载 &lt; 15 mA</text>
<line x1="540" y1="380" x2="660" y2="380" class="gw"/>

<!-- ===== power domain note ===== -->
<rect x="60" y="560" width="600" height="110" rx="2" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
<text x="75" y="582" font-size="13" font-weight="bold" fill="#111827">电源域划分与功耗</text>
<text x="75" y="604" font-size="11" fill="#2563eb">3.3V_D（数字域，常开）：MCU、USB、LED、TMP117、IOVDD</text>
<text x="75" y="624" font-size="11" fill="#059669">3.3V_A（模拟域，EN 受控）：AVDD、OPA388x3、OPA333、TMUX 模拟侧</text>
<text x="75" y="644" font-size="10" fill="#64748b">待机功耗：~17.6 uA（仅数字域）· 测量窗口：模拟域额外 ~15 mA</text>
<text x="75" y="662" font-size="10" fill="#64748b">双 LDO 天然隔离数模，无需磁珠；模拟域仅测量窗口上电</text>

<!-- ===== notes ===== -->
<text x="60" y="710" font-size="13" font-weight="bold" fill="#111827">图注与自查要点：</text>
<text x="60" y="735" font-size="11" fill="#374151">  数字轨 TPS7A0233 Iq 25 nA（常开），模拟轨 TPS7A2033 Iq 6.5 uA（EN 受控）</text>
<text x="60" y="757" font-size="11" fill="#374151">2. 电池截止 3.50 V 时两轨仍在稳压区（数字轨压差 ~68 mV，模拟轨 ~7 mV）</text>
<text x="60" y="779" font-size="11" fill="#374151">3. AVDD 距 ADS131A02 下限 3.0 V 余 &gt;= 0.25 V；合规栈裕量 &gt;= 0.65 V</text>
<text x="60" y="801" font-size="11" fill="#374151">4. 电池电压监测：PC0 经 2x1 MOhm 分压，常通 ~2 uA</text>
<text x="60" y="823" font-size="11" fill="#374151">5. 充电时 OUT 最高 4.23 V（电池 CV 上限），裕量更大</text>
</svg>
