<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" font-family="Noto Sans CJK SC">
<rect width="1100" height="850" fill="white"/>
<text x="35" y="40" font-size="27" fill="#1a1a1a">电源树</text>
<text x="35" y="70" font-size="14" fill="#556070">BQ24074 + 双 LDO · 保留输入防倒灌 · OUT 不串二极管</text>
<rect x="35" y="115" width="270" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="141" font-size="15" fill="#1a1a1a">USB 原始 VBUS</text>
<text x="47" y="166" font-size="15" fill="#1a1a1a">D1：阳极接 USB，阴极向 IN</text>
<rect x="35" y="255" width="270" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="281" font-size="15" fill="#1a1a1a">外部受限 5 V</text>
<text x="47" y="306" font-size="15" fill="#1a1a1a">D16：阳极接外5 V，阴极向 IN</text>
<line class="w" x1="305" y1="155" x2="355" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="305" y1="295" x2="355" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="355" y1="155" x2="355" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="355" cy="225" r="3" fill="#1a1a1a"/>
<line class="w" x1="355" y1="225" x2="405" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="405" y="175" width="245" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="417" y="201" font-size="15" fill="#1a1a1a">BQ24074 IN</text>
<text x="417" y="226" font-size="15" fill="#1a1a1a">BAT ↔ 1S 电池</text>
<text x="417" y="251" font-size="15" fill="#1a1a1a">OUT → VOUT</text>
<rect x="735" y="115" width="330" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="747" y="141" font-size="15" fill="#1a1a1a">数字 TLV75533 → VCC</text>
<text x="747" y="166" font-size="15" fill="#1a1a1a">MCU / ADC IOVDD / TF 直接供电</text>
<rect x="735" y="295" width="330" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="747" y="321" font-size="15" fill="#1a1a1a">原磁珠 → TPS7A2033 → AVCC</text>
<text x="747" y="346" font-size="15" fill="#1a1a1a">模拟前端；ANA_EN = PC3</text>
<line class="w" x1="650" y1="225" x2="695" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="695" cy="225" r="3" fill="#1a1a1a"/>
<line class="w" x1="695" y1="155" x2="695" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="695" y1="155" x2="735" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="695" y1="335" x2="735" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="440" width="490" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="466" font-size="15" fill="#1a1a1a">USB 原始 VBUS（D1之前）→100 kΩ→NPN B</text>
<text x="47" y="491" font-size="15" fill="#1a1a1a">B→1 MΩ→GND；E→GND</text>
<text x="47" y="516" font-size="15" fill="#1a1a1a">C→PC13；C→10 kΩ→VCC；低=VBUS存在</text>
<rect x="580" y="440" width="485" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="592" y="466" font-size="15" fill="#1a1a1a">NPN参考：MMBT3904，具体厂牌/脚序待核</text>
<text x="592" y="491" font-size="15" fill="#1a1a1a">BQ_PG=PB5，BQ_CHG=PC2，均输入上拉VCC</text>
<text x="592" y="516" font-size="15" fill="#1a1a1a">BQ_EN=PC1；PG不能区分USB和外部5 V</text>
<text x="35" y="660" font-size="18" fill="#1F4FD8">图注与自查要点</text>
<text x="35" y="690" font-size="14" fill="#556070">外5 V可以供电，也可能给电池充电；采用已接受的简单共用输入方案。</text>
<text x="35" y="716" font-size="14" fill="#556070">不把调试器3.3 V与VCC并联；不在BQ OUT增加串联二极管。</text>
<text x="35" y="742" font-size="14" fill="#556070">检测仅表示USB供电存在，不是精密阈值监控；BQ限流、USB授权和描述符仍需闭环。</text>
<text x="35" y="768" font-size="14" fill="#556070">低电、充电与写卡峰值下须验证LDO压差、稳定性与测量噪声。</text>
</svg>
