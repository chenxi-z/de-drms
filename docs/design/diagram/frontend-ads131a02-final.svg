<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"
     font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
  .w   { stroke:#374151; stroke-width:2;   fill:none }
  .wr  { stroke:#374151; stroke-width:2.5; fill:none }
  .sym { stroke:#374151; stroke-width:1.8; fill:none; stroke-linejoin:round }
  .p   { stroke:#7c3aed; stroke-width:1.8; fill:none; stroke-dasharray:6,4 }
  .gw  { stroke:#059669; stroke-width:3.5; fill:none }
  .ow  { stroke:#ea580c; stroke-width:3.5; fill:none }
  .gd  { stroke:#9ca3af; stroke-width:2;   fill:none; stroke-dasharray:5,4 }
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20,0 L0,0 0,20" fill="none" stroke="#eef2f7" stroke-width="1"/>
  </pattern>
  <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#059669"/></marker>
  <marker id="arrO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrK" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#374151"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="920" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="920" fill="url(#grid)"/>

<!-- ===== title ===== -->
<text x="40" y="50" font-size="22" font-weight="bold" fill="#111827">前端拓扑（定稿）：顶端偏置 + 低边恒流源 + 3 颗跟随器 + ADS131A02</text>
<text x="40" y="78" font-size="12" fill="#64748b">测量模式信号链 · R = k x (V_ch0 - d0) / V_ch1 x Rsense · 2026-10-14 补必接脚</text>
<text x="1560" y="50" font-size="12" fill="#94a3b8" text-anchor="end">E.2 / E.4</text>

<!-- ===== 3.3V_A rail + R_top + R_b ===== -->
<line x1="180" y1="140" x2="260" y2="140" class="wr"/>
<line x1="180" y1="140" x2="180" y2="128" class="sym"/>
<line x1="166" y1="128" x2="194" y2="128" stroke="#374151" stroke-width="2.5" fill="none"/>
<text x="155" y="133" font-size="12" font-weight="bold" fill="#059669" text-anchor="end">3.3V_A</text>
<line x1="260" y1="140" x2="260" y2="162" class="w"/>
<rect x="246" y="162" width="28" height="44" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="276" y="182" font-size="12" font-weight="bold" fill="#111827">R_top</text>
<text x="276" y="198" font-size="10" fill="#64748b">10 kOhm</text>
<line x1="260" y1="206" x2="260" y2="232" class="w"/>
<circle cx="260" cy="232" r="4.5" fill="#111827"/>
<text x="248" y="226" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">T</text>
<line x1="260" y1="232" x2="80" y2="232" class="w"/>
<line x1="80" y1="232" x2="80" y2="252" class="w"/>
<rect x="66" y="252" width="28" height="44" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="96" y="272" font-size="12" font-weight="bold" fill="#111827">R_b</text>
<text x="96" y="288" font-size="10" fill="#64748b">150 kOhm</text>
<line x1="80" y1="296" x2="80" y2="314" class="w"/>
<line x1="64" y1="314" x2="96" y2="314" stroke="#374151" stroke-width="2.5" fill="none"/>
<line x1="70" y1="320" x2="90" y2="320" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="76" y1="326" x2="84" y2="326" stroke="#374151" stroke-width="2" fill="none"/>

<!-- ===== sample ===== -->
<line x1="260" y1="232" x2="260" y2="256" class="gw"/>
<rect x="180" y="256" width="160" height="58" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="260" y="278" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">R_sample</text>
<text x="260" y="296" font-size="10.5" fill="#92400e" text-anchor="middle">10-120 kOhm</text>
<text x="260" y="310" font-size="9.5" fill="#b45309" text-anchor="middle">（板外器件）</text>
<line x1="260" y1="314" x2="260" y2="346" class="gw"/>
<circle cx="260" cy="346" r="4.5" fill="#111827"/>
<text x="248" y="342" font-size="14" font-weight="bold" fill="#111827" text-anchor="end">S</text>
<line x1="260" y1="346" x2="260" y2="370" class="gw"/>
<circle cx="260" cy="370" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<circle cx="260" cy="404" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<line x1="260" y1="404" x2="261" y2="373" class="sym"/>
<line x1="290.5" y1="388.5" x2="260.5" y2="388.5" class="p"/>
<circle cx="260.5" cy="388.5" r="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="298" y="392" font-size="10" font-weight="bold" fill="#7c3aed">K1 (SEL_K1 PB5)</text>
<line x1="260" y1="404" x2="260" y2="424" class="gw"/>
<circle cx="260" cy="424" r="4.5" fill="#111827"/>
<text x="248" y="420" font-size="12" font-weight="bold" fill="#111827" text-anchor="end">X</text>

<!-- ===== constant current source ===== -->
<rect x="168" y="424" width="184" height="78" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
<text x="260" y="446" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">OPA333 + BSS138</text>
<text x="260" y="464" font-size="10.5" fill="#065f46" text-anchor="middle">I = VSET / Rsense</text>
<text x="260" y="480" font-size="10" fill="#64748b" text-anchor="middle">7.86 uA</text>
<text x="260" y="494" font-size="10" fill="#64748b" text-anchor="middle">CURR_DIS=PB10</text>
<line x1="260" y1="502" x2="260" y2="528" class="gw"/>
<circle cx="260" cy="528" r="4.5" fill="#111827"/>
<text x="248" y="524" font-size="14" font-weight="bold" fill="#111827" text-anchor="end">B</text>
<line x1="260" y1="528" x2="260" y2="548" class="gw"/>
<rect x="246" y="548" width="28" height="52" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="276" y="570" font-size="12" font-weight="bold" fill="#111827">R_sense</text>
<text x="276" y="586" font-size="10" fill="#64748b">150 kOhm 0.1%</text>
<line x1="260" y1="600" x2="260" y2="628" class="gw"/>
<circle cx="260" cy="628" r="4.5" fill="#111827"/>
<text x="248" y="624" font-size="14" font-weight="bold" fill="#111827" text-anchor="end">E</text>
<line x1="244" y1="644" x2="276" y2="644" stroke="#374151" stroke-width="2.5" fill="none"/>
<line x1="250" y1="650" x2="270" y2="650" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="256" y1="656" x2="264" y2="656" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="260" y1="628" x2="260" y2="644" class="w"/>

<!-- ===== node voltages ===== -->
<text x="350" y="226" font-size="10" fill="#2563eb">T：2.97-3.07 V</text>
<text x="350" y="340" font-size="10" fill="#2563eb">S：2.03-2.99 V</text>
<text x="350" y="520" font-size="10" fill="#2563eb">B：~1.18 V</text>
<text x="350" y="618" font-size="10" fill="#2563eb">E：0 V（GND）</text>

<!-- ===== 3x OPA388 followers ===== -->
<line x1="260" y1="232" x2="560" y2="232" class="w"/>
<circle cx="560" cy="232" r="4.5" fill="#111827"/>
<line x1="560" y1="232" x2="560" y2="210" class="w"/>
<line x1="560" y1="210" x2="600" y2="210" class="w"/>
<polygon points="600,187 600,233 656,210" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="215" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="249" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388 (T)</text>
<line x1="656" y1="210" x2="880" y2="210" class="w"/>
<line x1="260" y1="346" x2="560" y2="346" class="w"/>
<circle cx="560" cy="346" r="4.5" fill="#111827"/>
<text x="550" y="340" font-size="10.5" font-weight="bold" fill="#111827" text-anchor="end">S (K3)</text>
<line x1="560" y1="346" x2="560" y2="330" class="w"/>
<line x1="560" y1="330" x2="600" y2="330" class="w"/>
<polygon points="600,307 600,353 656,330" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="335" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="369" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388 (S)</text>
<line x1="656" y1="330" x2="880" y2="330" class="w"/>
<line x1="260" y1="528" x2="560" y2="528" class="w"/>
<circle cx="560" cy="528" r="4.5" fill="#111827"/>
<line x1="560" y1="528" x2="560" y2="510" class="w"/>
<line x1="560" y1="510" x2="600" y2="510" class="w"/>
<polygon points="600,487 600,533 656,510" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="515" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="549" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388 (B)</text>
<line x1="656" y1="510" x2="880" y2="510" class="w"/>
<line x1="260" y1="628" x2="850" y2="628" class="w"/>
<line x1="850" y1="628" x2="850" y2="590" class="w"/>
<line x1="850" y1="590" x2="880" y2="590" class="w"/>
<text x="480" y="622" font-size="10" fill="#2563eb">E -&gt; AIN1N：Rsense 底端 Kelvin 引线，不经跟随器</text>

<!-- ===== ADS131A02 with mandatory pins ===== -->
<rect x="880" y="140" width="200" height="520" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="980" y="168" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ADS131A02</text>
<text x="980" y="186" font-size="10" fill="#2563eb" text-anchor="middle">24-bit SigmaDelta  128 kSPS</text>
<text x="980" y="200" font-size="10" fill="#2563eb" text-anchor="middle">双通道同步采样</text>
<text x="890" y="214" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0P</text>
<text x="890" y="334" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0N</text>
<text x="890" y="514" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1P</text>
<text x="890" y="594" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1N</text>
<text x="1070" y="270" font-size="10.5" font-weight="bold" fill="#0369a1" text-anchor="end">CH0: V_sample</text>
<text x="1070" y="286" font-size="10" fill="#0369a1" text-anchor="end">(T - S)</text>
<text x="1070" y="470" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="end">CH1: V_Rsense</text>
<text x="1070" y="486" font-size="10" fill="#b45309" text-anchor="end">(B - E)</text>
<text x="980" y="400" font-size="10" fill="#2563eb" text-anchor="middle">V_ref = 2.442 V（内部基准）</text>
<text x="980" y="416" font-size="10" fill="#2563eb" text-anchor="middle">16.384 MHz XTAL</text>
<text x="980" y="432" font-size="10" fill="#2563eb" text-anchor="middle">SPI -&gt; MCU</text>

<!-- ===== mandatory pins ===== -->
<text x="1090" y="224" font-size="9.5" font-weight="bold" fill="#1e3a8a">RESV(16)</text>
<line x1="1080" y1="228" x2="1120" y2="228" class="w"/>
<text x="1135" y="224" font-size="9.5" fill="#2563eb">-&gt; IOVDD</text>
<text x="1135" y="238" font-size="8.5" fill="#94a3b8">(手册要求必接)</text>
<text x="1090" y="260" font-size="9.5" font-weight="bold" fill="#1e3a8a">CAP(28)</text>
<line x1="1080" y1="264" x2="1120" y2="264" class="w"/>
<text x="1135" y="260" font-size="9.5" fill="#2563eb">-&gt; 1 uF -&gt; GND</text>
<text x="1135" y="274" font-size="8.5" fill="#94a3b8">(内部数字 LDO)</text>
<text x="1090" y="300" font-size="9.5" font-weight="bold" fill="#1e3a8a">NC(24)</text>
<line x1="1080" y1="304" x2="1120" y2="304" class="w"/>
<text x="1135" y="300" font-size="9.5" fill="#2563eb">-&gt; 10 kOhm -&gt; GND</text>
<text x="1135" y="314" font-size="8.5" fill="#94a3b8">(数字输出)</text>
<text x="1090" y="340" font-size="9.5" font-weight="bold" fill="#1e3a8a">NC(5-8)</text>
<line x1="1080" y1="344" x2="1120" y2="344" class="w"/>
<text x="1135" y="340" font-size="9.5" fill="#2563eb">AVSS 或悬空</text>
<text x="1090" y="376" font-size="9.5" font-weight="bold" fill="#059669">AVDD</text>
<line x1="1080" y1="380" x2="1120" y2="380" class="w"/>
<text x="1135" y="376" font-size="9.5" fill="#059669">&gt;= 1 uF 解耦</text>
<text x="1090" y="400" font-size="9.5" font-weight="bold" fill="#2563eb">IOVDD</text>
<line x1="1080" y1="404" x2="1120" y2="404" class="w"/>
<text x="1135" y="400" font-size="9.5" fill="#2563eb">-&gt; 3.3V_D, &gt;= 1 uF</text>
<text x="1090" y="440" font-size="9.5" font-weight="bold" fill="#1e3a8a">REFP/REFN</text>
<text x="1145" y="440" font-size="9.5" fill="#2563eb">内部 2.442 V</text>
<text x="1090" y="462" font-size="9.5" font-weight="bold" fill="#1e3a8a">REFEXT</text>
<text x="1135" y="462" font-size="9.5" fill="#2563eb">MIN 2.0V / MAX</text>
<text x="1135" y="476" font-size="9.5" fill="#2563eb">AVDD-0.5V</text>
<text x="1090" y="500" font-size="9.5" font-weight="bold" fill="#1e3a8a">VNCP</text>
<text x="1135" y="500" font-size="9.5" fill="#2563eb">1 uF 接 AVSS</text>

<!-- ===== MCU ===== -->
<line x1="1080" y1="370" x2="1280" y2="370" class="w"/>
<text x="1180" y="364" font-size="10" fill="#64748b" text-anchor="middle">SPI</text>
<rect x="1280" y="360" width="200" height="110" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1380" y="386" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">STM32U545RET6Q</text>
<text x="1380" y="406" font-size="10" fill="#5b21b6" text-anchor="middle">SPI 3.3V 直连</text>
<text x="1380" y="424" font-size="10" fill="#5b21b6" text-anchor="middle">274 KB SRAM</text>
<text x="1380" y="442" font-size="10" fill="#5b21b6" text-anchor="middle">k：Flash / d0：RAM</text>
<text x="1380" y="460" font-size="10" fill="#5b21b6" text-anchor="middle">USB OTG FS</text>

<!-- ===== formula ===== -->
<rect x="440" y="700" width="720" height="78" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="800" y="724" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">R_sample = k x (V_ch0 - d0) / V_ch1 x R_sense</text>
<text x="800" y="746" font-size="10.5" fill="#166534" text-anchor="middle">双通道同步：恒流 I 与基准误差在除法中抵消；d0 消 ADC 失调；k 由 R_ref 校准</text>
<text x="800" y="764" font-size="10.5" fill="#166534" text-anchor="middle">跟随器只缓冲高阻节点（T/S/B），距电源轨 &gt;= 0.15V；E -&gt; AIN1N 经 Kelvin RC</text>

<!-- ===== notes ===== -->
<text x="40" y="810" font-size="12" font-weight="bold" fill="#111827">要点：</text>
<text x="40" y="830" font-size="10.5" fill="#374151">1. T 偏置：R_top 10k / R_b 150k -&gt; T~3.0V</text>
<text x="40" y="848" font-size="10.5" fill="#374151">2. 3 颗 OPA388 跟随器（T、S、B）</text>
<text x="40" y="866" font-size="10.5" fill="#374151">3. E -&gt; AIN1N 直连（Kelvin，不经跟随器）</text>
<text x="40" y="884" font-size="10.5" fill="#374151">4. ADC 必接脚全接（RESV/CAP/NC24/NC5-8/解耦）</text>
<text x="40" y="902" font-size="10.5" fill="#374151">5. 每线 1 kOhm + 10 nF RC 进 ADC</text>
<text x="40" y="918" font-size="10.5" fill="#374151">6. 4 1/2 位 @120k，4 位 @10k（INL 限制）</text>
<text x="540" y="810" font-size="10" fill="#64748b">3.3V_D（数字域常开）：MCU、USB、IOVDD    3.3V_A（模拟域 EN 受控）：AVDD、OPA388x3、OPA333、TMUX</text>
</svg>
