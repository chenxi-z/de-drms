<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"
     font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
  .w   { stroke:#374151; stroke-width:2;   fill:none }
  .wr  { stroke:#374151; stroke-width:2.5; fill:none }
  .sym { stroke:#374151; stroke-width:1.8; fill:none; stroke-linejoin:round }
  .p   { stroke:#7c3aed; stroke-width:1.8; fill:none; stroke-dasharray:6,4 }
  .gw  { stroke:#059669; stroke-width:3.5; fill:none }
  .ow  { stroke:#ea580c; stroke-width:3.5; fill:none }
  .gd  { stroke:#9ca3af; stroke-width:2;   fill:none; stroke-dasharray:5,4 }
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20,0 L0,0 0,20" fill="none" stroke="#eef2f7" stroke-width="1"/>
  </pattern>
  <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#059669"/></marker>
  <marker id="arrO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#ea580c"/></marker>
  <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#2563eb"/></marker>
  <marker id="arrK" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#374151"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="800" fill="url(#grid)"/>

<!-- ===== 标题块 ===== -->
<text x="40" y="56" font-size="22" font-weight="bold" fill="#0f172a">前端拓扑（定稿）：顶端偏置 + 低边恒流源 + 3 颗跟随器 + ADS131A02 双通道同步实测</text>
<text x="40" y="84" font-size="12.5" fill="#64748b">测量模式信号链（R_ref 切换与零点模式见 rref-calibration-circuit 图）· R = k × (V_ch0 − δ0) / V_ch1 × Rsense</text>
<text x="1360" y="56" font-size="12" fill="#94a3b8" text-anchor="end">附录 E.2 / E.4 · 2026-10-13 重画</text>

<!-- ===== 激励链：3.3V_A → R_top → T → 样品 → S → K1 → X → BSS138 → B → Rsense → E ===== -->
<text x="40" y="124" font-size="13" font-weight="bold" fill="#166534">恒流激励链（测量模式，绿 = 电流路径）</text>
<line x1="180" y1="150" x2="240" y2="150" class="wr"/>
<line x1="180" y1="150" x2="180" y2="140" class="sym"/>
<line x1="166" y1="140" x2="194" y2="140" stroke="#374151" stroke-width="2.5" fill="none"/>
<text x="162" y="145" font-size="12" font-weight="bold" fill="#374151" text-anchor="end">3.3V_A</text>
<line x1="240" y1="150" x2="240" y2="170" class="gw"/>
<rect x="226" y="170" width="28" height="44" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="262" y="190" font-size="12.5" font-weight="bold" fill="#111827">R<tspan font-size="9.0" dy="2">top</tspan></text>
<text x="262" y="207" font-size="10.5" fill="#374151">10 kΩ</text>
<line x1="240" y1="214" x2="240" y2="240" class="gw"/>
<circle cx="240" cy="240" r="4.5" fill="#111827"/>
<text x="228" y="234" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">T</text>
<line x1="240" y1="240" x2="70" y2="240" class="w"/>
<line x1="70" y1="240" x2="70" y2="258" class="w"/>
<rect x="56" y="258" width="28" height="44" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="92" y="278" font-size="12.5" font-weight="bold" fill="#111827">R<tspan font-size="9.0" dy="2">b</tspan></text>
<text x="92" y="295" font-size="10.5" fill="#374151">150 kΩ</text>
<line x1="70" y1="302" x2="70" y2="318" class="w"/>
<line x1="54" y1="318" x2="86" y2="318" stroke="#374151" stroke-width="2.5" fill="none"/>
<line x1="60" y1="324" x2="80" y2="324" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="66" y1="330" x2="74" y2="330" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="240" y1="240" x2="240" y2="264" class="gw" marker-end="url(#arrG)"/>
<rect x="160" y="264" width="160" height="64" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="240" y="288" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">被测样品 R_sample</text>
<text x="240" y="306" font-size="11.5" fill="#92400e" text-anchor="middle">MWCNTs 10–120 kΩ</text>
<text x="240" y="321" font-size="10" fill="#b45309" text-anchor="middle">（板外，XH2.54-2P）</text>
<line x1="240" y1="328" x2="240" y2="360" class="gw"/>
<circle cx="240" cy="360" r="4.5" fill="#111827"/>
<text x="228" y="356" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">S</text>
<line x1="240" y1="360" x2="240" y2="384" class="gw"/>
<circle cx="240" cy="384" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<circle cx="240" cy="414" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<line x1="240" y1="414" x2="241" y2="387" class="sym"/>
<text x="254" y="404" font-size="10.5" font-weight="bold" fill="#7c3aed">K1（测量态导通）</text>
<line x1="240" y1="414" x2="240" y2="436" class="gw"/>
<circle cx="240" cy="436" r="4.5" fill="#111827"/>
<text x="250" y="431" font-size="12" font-weight="bold" fill="#111827">X</text>
<rect x="150" y="436" width="180" height="84" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
<text x="240" y="458" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">低边恒流源 7.86 µA</text>
<text x="240" y="475" font-size="10.5" fill="#065f46" text-anchor="middle">BSS138 + OPA333</text>
<text x="240" y="491" font-size="10.5" fill="#065f46" text-anchor="middle">I = VSET / Rsense</text>
<text x="240" y="507" font-size="10" fill="#64748b" text-anchor="middle">VSET 1.179 V · CURR_DIS 可关断</text>
<line x1="240" y1="520" x2="240" y2="544" class="gw"/>
<circle cx="240" cy="544" r="4.5" fill="#111827"/>
<text x="228" y="539" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">B</text>
<line x1="240" y1="544" x2="240" y2="566" class="gw"/>
<rect x="226" y="566" width="28" height="52" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.8"/>
<text x="262" y="586" font-size="12.5" font-weight="bold" fill="#111827">R<tspan font-size="9.0" dy="2">sense</tspan></text>
<text x="262" y="603" font-size="10.5" fill="#374151">150 kΩ 0.1%</text>
<line x1="240" y1="618" x2="240" y2="644" class="gw" marker-end="url(#arrG)"/>
<circle cx="240" cy="644" r="4.5" fill="#111827"/>
<text x="228" y="639" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">E</text>
<line x1="240" y1="644" x2="240" y2="662" class="w"/>
<line x1="224" y1="662" x2="256" y2="662" stroke="#374151" stroke-width="2.5" fill="none"/>
<line x1="230" y1="668" x2="250" y2="668" stroke="#374151" stroke-width="2" fill="none"/>
<line x1="236" y1="674" x2="244" y2="674" stroke="#374151" stroke-width="2" fill="none"/>

<!-- ===== 节点电压（全角落，跟随器距电源轨 ≥0.15 V） ===== -->
<text x="310" y="232" font-size="10" fill="#2563eb">T ≈2.97–3.07 V</text>
<text x="310" y="352" font-size="10" fill="#2563eb">S 2.03–2.99 V</text>
<text x="310" y="536" font-size="10" fill="#2563eb">B ≈1.18 V</text>
<text x="310" y="636" font-size="10" fill="#2563eb">E = 0 V（地）</text>

<!-- ===== 3 颗跟随器（T、S、B）；E 经 Kelvin 引线直接进 AIN1N ===== -->
<line x1="240" y1="240" x2="600" y2="240" class="w"/>
<polygon points="600,217 600,263 656,240" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="245" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="279" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388</text>
<line x1="656" y1="240" x2="880" y2="240" class="w"/>
<line x1="240" y1="360" x2="600" y2="360" class="w"/>
<polygon points="600,337 600,383 656,360" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="365" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="399" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388</text>
<line x1="656" y1="360" x2="880" y2="360" class="w"/>
<line x1="240" y1="544" x2="600" y2="544" class="w"/>
<polygon points="600,521 600,567 656,544" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="616" y="549" font-size="13" font-weight="bold" fill="#111827">×1</text>
<text x="628" y="583" font-size="10.5" fill="#94a3b8" text-anchor="middle">OPA388</text>
<line x1="656" y1="544" x2="880" y2="544" class="w"/>
<text x="590" y="233" font-size="12" font-weight="bold" fill="#111827" text-anchor="end">T</text>
<text x="590" y="353" font-size="12" font-weight="bold" fill="#111827" text-anchor="end">S（经 K3）</text>
<text x="590" y="537" font-size="12" font-weight="bold" fill="#111827" text-anchor="end">B</text>
<polyline points="240,644 840,644 840,604 880,604" class="w"/>
<text x="430" y="637" font-size="10.5" fill="#2563eb">E → AIN1N：Rsense 底端 Kelvin 引线，不经跟随器</text>
<text x="628" y="300" font-size="11" fill="#64748b" text-anchor="middle">跟随器 ×3（OPA388）</text>
<rect x="880" y="160" width="190" height="500" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="975" y="188" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ADS131A02</text>
<text x="975" y="207" font-size="10.5" fill="#2563eb" text-anchor="middle">24-bit ΣΔ · 128 kSPS</text>
<text x="890" y="244" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0P</text>
<text x="890" y="364" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0N</text>
<text x="890" y="548" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1P</text>
<text x="890" y="608" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1N</text>
<text x="1060" y="306" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="end">CH0：V_sample</text>
<text x="1060" y="324" font-size="10.5" fill="#0369a1" text-anchor="end">（T − S）</text>
<text x="1060" y="500" font-size="11" font-weight="bold" fill="#b45309" text-anchor="end">CH1：V_Rsense</text>
<text x="1060" y="518" font-size="10.5" fill="#b45309" text-anchor="end">（B − E）</text>
<text x="975" y="430" font-size="10.5" fill="#2563eb" text-anchor="middle">两通道同一时钟沿转换</text>
<text x="975" y="448" font-size="10.5" fill="#2563eb" text-anchor="middle">内部基准 2.442 V</text>
<text x="975" y="682" font-size="9.5" fill="#94a3b8" text-anchor="middle">每线 1 kΩ + 10 nF 进 ADC（图略）</text>

<!-- ===== MCU ===== -->
<line x1="1070" y1="390" x2="1150" y2="390" class="w" marker-end="url(#arrK)"/>
<text x="1110" y="382" font-size="10.5" fill="#64748b" text-anchor="middle">SPI</text>
<rect x="1150" y="330" width="210" height="120" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1255" y="358" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">MCU（STM32U575RGT6）</text>
<text x="1255" y="380" font-size="10.5" fill="#5b21b6" text-anchor="middle">SPI 3.3 V 直连 · 软件除法</text>
<text x="1255" y="400" font-size="10.5" fill="#5b21b6" text-anchor="middle">786 KB SRAM · USB OTG FS</text>
<text x="1255" y="422" font-size="10.5" fill="#5b21b6" text-anchor="middle">k 存 Flash · δ0 存 RAM</text>

<!-- ===== 公式与要点 ===== -->
<rect x="540" y="700" width="820" height="84" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="950" y="726" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">R_sample = k × (V_ch0 − δ0) ÷ V_ch1 × Rsense</text>
<text x="950" y="750" font-size="11" fill="#166534" text-anchor="middle">两通道同步测 → 恒流 I 与基准误差在除法中抵消；零点模式测出的 δ0 消 ADC 失调；k 由 R_ref 校准</text>
<text x="950" y="770" font-size="11" fill="#166534" text-anchor="middle">断裂时 V_Rsense → 0，软件判开路；跟随器只缓冲高阻节点，距电源轨均 ≥0.15 V</text>
</svg>
