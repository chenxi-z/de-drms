<!-- ===== title ===== -->
<text x="40" y="58" font-size="27" font-weight="bold" fill="#111827">抗混叠滤波电路（ADS131A02 前端 · 128 kSPS）</text>
<text x="40" y="86" font-size="12.5" fill="#64748b">双电极直流电阻测量仪 · 每线 1 kOhm + 10 nF 对地 + 每通道 10 nF 差分 · SigmaDelta 两级采样的抗混叠分工</text>
<text x="1460" y="58" font-size="12" fill="#94a3b8" text-anchor="end">附录 E.4 · 2026-10-18 重设计</text>
<text x="1460" y="86" font-size="12" fill="#94a3b8" text-anchor="end">混叠锚点 fMOD = 4.096 MHz（16.384 MHz / 4）</text>

