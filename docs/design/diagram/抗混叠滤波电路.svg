<text x="35" y="620" font-size="14" fill="#556070">本图复制到两通道：共 8 颗串联电阻、8 颗 10 nF、2 颗 820 pF；全部电容 C0G/NP0。</text>
<text x="35" y="646" font-size="14" fill="#556070">电容下端均接 AGND。通道1：缓冲 V_P / AFE_M；通道2：缓冲 AFE_B / Kelvin 地。</text>
<text x="35" y="672" font-size="14" fill="#556070">通道2负端没有运放，Kelvin 地从 Rsense 底端独立引出，不借用数字回流走线。</text>
<text x="35" y="698" font-size="14" fill="#556070">T2 台架：D1=62.33 dB、D3=94.74 dB 均未达门槛；不能标注“全部通过”。</text>
<text x="35" y="724" font-size="14" fill="#556070">普通容差贴装不保证 80 dB 匹配；理想整线选配结果不等于实物量产性能。</text>
<text x="35" y="750" font-size="14" fill="#556070">替换原 RC 群；末级贴近 ADC，两线镜像，远离 SPI/SDMMC；实际布线与 DRC 尚未完成。</text>
