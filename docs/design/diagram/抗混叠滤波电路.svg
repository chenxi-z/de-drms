<!-- ===== ADC box ===== -->
<rect x="960" y="160" width="190" height="540" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1055" y="192" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ADS131A02</text>
<text x="1055" y="218" font-size="10" fill="#2563eb" text-anchor="middle">双通道同步 24 bit SigmaDelta</text>
<text x="968" y="204" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0P</text>
<text x="968" y="344" font-size="11" font-weight="bold" fill="#1e3a8a">AIN0N</text>
<text x="968" y="504" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1P</text>
<text x="968" y="644" font-size="11" font-weight="bold" fill="#1e3a8a">AIN1N</text>
<text x="1142" y="276" font-size="11" fill="#2563eb" text-anchor="end">通道 0</text>
<text x="1142" y="576" font-size="11" fill="#2563eb" text-anchor="end">通道 1</text>
<text x="1055" y="678" font-size="9.5" fill="#1e3a8a" text-anchor="middle">fMOD 4.096 MHz · OSR 32</text>
<text x="1055" y="694" font-size="9.5" fill="#1e3a8a" text-anchor="middle">128 kSPS · 内部基准 2.442 V</text>

<!-- ===== panel 1: two-stage sampling ===== -->
<rect x="1190" y="160" width="280" height="232" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1210" y="186" font-size="13" font-weight="bold" fill="#111827">两级采样与抗混叠分工（香农落点）</text>
<text x="1210" y="212" font-size="10.5" fill="#374151">模拟信号 → RC 网络（本图）</text>
<text x="1210" y="232" font-size="10.5" fill="#374151">→ 调制器采样 @ fMOD 4.096 MHz</text>
<text x="1210" y="252" font-size="10.5" fill="#374151">→ 数字抽取 OSR = 32 → 128 kSPS</text>
<text x="1210" y="280" font-size="10.5" fill="#2563eb">模拟 RC：压制 fMOD 附近折叠与</text>
<text x="1210" y="296" font-size="10.5" fill="#2563eb">开关噪声 + 采样电荷储罐</text>
<text x="1210" y="324" font-size="10.5" fill="#2563eb">64 kHz ~ fMOD 混叠：数字滤波器</text>
<text x="1210" y="340" font-size="10.5" fill="#2563eb">负责（SigmaDelta 固有；无需 64 kHz 阻带）</text>

<!-- ===== panel 2: response ===== -->
<rect x="1190" y="420" width="280" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1210" y="446" font-size="13" font-weight="bold" fill="#111827">频响 / 衰减 / 瞬态（设计值）</text>
<text x="1210" y="472" font-size="10.5" fill="#374151">共模极点 fc = 15.9 kHz（每线 1k+10n）</text>
<text x="1210" y="492" font-size="10.5" fill="#374151">差模 fc = 5.3 kHz（C_eff = 30 nF）</text>
<text x="1210" y="512" font-size="10.5" fill="#374151">@4.096 MHz：CM -48 dB · DM -58 dB</text>
<text x="1210" y="532" font-size="10.5" fill="#374151">@16.384 MHz：CM -60 dB · DM -70 dB</text>
<text x="1210" y="552" font-size="10.5" fill="#374151">tau：CM 10 us · DM 30 us（7tau = 210 us）</text>
<text x="1210" y="572" font-size="10.5" fill="#374151">换路预算 1 ms（E.3.3）：裕量约 5 倍</text>
<text x="1210" y="600" font-size="10.5" fill="#64748b">C 全 C0G/NP0 · 四线同批同值 · R 用 1%</text>
<text x="1210" y="620" font-size="10.5" fill="#64748b">1 kOhm 热噪声 4 nV/√Hz，积分后</text>
<text x="1210" y="636" font-size="10.5" fill="#64748b">远低于 128 kSPS 噪声底（DR 85.1 dB）</text>
<text x="1210" y="656" font-size="10.5" fill="#94a3b8">待核：OSR=32 数字阻带曲线（SBAS590）</text>

<!-- ===== footer notes ===== -->
<rect x="30" y="760" width="1440" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50" y="786" font-size="13" font-weight="bold" fill="#111827">图注与自查要点</text>
<text x="50" y="810" font-size="10.5" fill="#374151">1. 拓扑：每线 1 kOhm 串阻 + 10 nF 对 AGND（V_P / M / B 在跟随器输出后，E 从 Rsense 底端 Kelvin 引线引出）+ 每通道 10 nF 跨 P-N——共 4R + 6C；C 全 C0G/NP0、四线同批同值（比值抵消前提）。</text>
<text x="50" y="828" font-size="10.5" fill="#374151">2. 差模等效电容 = C_cm + 2 × C_diff = 30 nF → fc_DM = 5.3 kHz；共模 fc = 15.9 kHz；C_diff 兼作调制器开关电容输入的电荷储罐（10 nF 远大于 ~7 pF 采样电容，注入扰动 &lt; 0.1%）。</text>
<text x="50" y="846" font-size="10.5" fill="#374151">3. 香农落点：模拟域采样发生在 fMOD = 4.096 MHz，128 kSPS 只是数字抽取输出——抽取级抗混叠由数字滤波器阻带承担，模拟 RC 只需覆盖 k·fMOD ± fB 折叠区（教科书式 64 kHz 阻带对一阶 RC 既不必要也做不到）。</text>
<text x="50" y="864" font-size="10.5" fill="#374151">4. 比值法：通带跌落与群延迟在 ch0 / ch1 中同构抵消；残余失配项 @100 Hz &lt; 0.002%、@1 kHz 约 0.1%（C0G 5% 失配 + R 1%；冲击信号能量集中于百 Hz 以下，实际影响远小）。</text>
<text x="50" y="882" font-size="10.5" fill="#374151">5. 负载与直流：对 Zin ≈ 130 kOhm 分压 -0.08%，被比值吸收；E 线 1 kOhm 上输入泄漏压降 µV 级，被 d0/k 吸收；50 Hz 工频在通带内，模拟侧不动，靠准静态平均压制。</text>
<text x="50" y="900" font-size="10.5" fill="#374151">6. 位置纪律：R 靠信号源（跟随器输出）侧，C 靠 ADC 引脚侧；四组走线同长同构；C_diff 两颗对称居中。待核一项：SBAS590 Filter Characteristics 的 OSR=32 阻带曲线（定 64k~fMOD 区间裕量数值）。</text>
</svg>
