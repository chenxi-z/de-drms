<!-- ===== H. 图注 ===== -->
<rect x="40" y="646" width="1420" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="674" font-size="13" font-weight="bold" fill="#111827">图注与自查要点（照抄原理图时逐条核）</text>
<text x="60" y="698" font-size="10.5" fill="#374151">① VSET = 3.3V_A × R2/(R1+R2) = 3.3 × 200k/560k = 1.179 V；分压电流 5.9 µA（仅模拟轨在线时）；1% 电阻即可——比值法中 I 在 V_ch0/V_ch1 相除时完全抵消，不需要精密基准</text>
<text x="60" y="718" font-size="10.5" fill="#374151">② 关断：Q2(BSS138) 漏→VSET、源→GND，栅极由 CURR_DIS(PB10) 驱动 + R_g 1 MΩ 下拉 → 复位/高阻默认 Q2 关断（激励开）；CURR_DIS = 1 → VSET ≈ 0 → I = 0</text>
<text x="60" y="738" font-size="10.5" fill="#374151">③ 环路：U10（+IN = VSET，−IN = B，OUT → Q1 栅）+ Q1 + Rsense（源极路径）→ I = VSET/Rsense，与 R_sample 无关；仿真 fc ≈ 248 kHz / PM 70.1°（sim/ccsource）</text>
<text x="60" y="758" font-size="10.5" fill="#374151">④ 引脚（手册核实）：U10 = 1:OUT 2:V− 3:+IN 4:−IN 5:V+（SOT-23-5）；Q1 / Q2 = 1:G 2:S 3:D（SOT-23）；V+ 接 3.3V_A，V− 接 GND</text>
<text x="60" y="778" font-size="10.5" fill="#374151">⑤ ADC 侧：B → OPA388(B) 跟随器 → 1 kΩ + 10 nF → AIN1P；E → 1 kΩ + 10 nF → AIN1N（Kelvin 引线，不经跟随器）；RC 到 AGND</text>
<text x="60" y="798" font-size="10.5" fill="#374151">⑥ 合规栈：V_sample(120 kΩ) 0.94 V + V_Rsense 1.18 V + Q1 压降 ≈ 0.2 V = 2.32 V ≤ T 点(≥ 2.97 V) − 0.5 V ✓；关断净省 ≈ 10.6 µA</text>
<text x="60" y="818" font-size="10.5" fill="#374151">⑦ 布局：B / E 为 Kelvin 取点（自 Rsense 焊盘单独引线）；Q1 栅极走线短并远离 B/E 与 ADC 输入；R1/R2 与 VSET 滤波电容靠运放同相端</text>
<text x="60" y="836" font-size="9" fill="#94a3b8">位号：U10 = OPA333（恒流源运放）· Q1 = 恒流管 BSS138L · Q2 = 关断管 BSS138L · R_sense = 150 kΩ 0.1%；网络：X = 链路底端 · B = Rsense 顶端 · E = GND</text>
</svg>
