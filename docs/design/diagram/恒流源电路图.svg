<text x="442" y="121" font-size="14" fill="#1a1a1a">R28 200 kΩ</text>
<line class="w" x1="370" y1="140" x2="430" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="510" y1="140" x2="545" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="545" y1="140" x2="545" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="sym" x1="533" y1="150" x2="557" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="sym" x1="537" y1="155" x2="553" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="sym" x1="541" y1="160" x2="549" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="370" y1="140" x2="370" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="370" y1="235" x2="600" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="600" y="200" width="220" height="125" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="612" y="226" font-size="15" fill="#1a1a1a">U13 OPA333</text>
<text x="612" y="251" font-size="15" fill="#1a1a1a">IN+ ← VSET</text>
<text x="612" y="276" font-size="15" fill="#1a1a1a">IN− ← AFE_B</text>
<text x="612" y="301" font-size="15" fill="#1a1a1a">OUT → Q2 G</text>
<rect x="870" y="200" width="195" height="125" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="882" y="226" font-size="15" fill="#1a1a1a">Q2 BSS138</text>
<text x="882" y="251" font-size="15" fill="#1a1a1a">D ← 回流节点 X</text>
<text x="882" y="276" font-size="15" fill="#1a1a1a">S → AFE_B</text>
<text x="882" y="301" font-size="15" fill="#1a1a1a">G ← U13 OUT</text>
<line class="w" x1="820" y1="285" x2="870" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="600" y="390" width="465" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="612" y="416" font-size="15" fill="#1a1a1a">AFE_B → R26 150 kΩ → AGND</text>
<text x="612" y="441" font-size="15" fill="#1a1a1a">AFE_B 同时反馈 U13 IN− 并送电流通道缓冲</text>
<line class="w" x1="965" y1="325" x2="965" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="340" width="495" height="125" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="366" font-size="15" fill="#1a1a1a">Q3：D→VSET，S→AGND，G→PB10</text>
<text x="47" y="391" font-size="15" fill="#1a1a1a">PB10 高：压低VSET；低：允许固定分压激励</text>
<text x="47" y="416" font-size="15" fill="#1a1a1a">R29 改100 kΩ：Q3 G上拉数字VCC</text>
<text x="47" y="441" font-size="15" fill="#1a1a1a">ANA_EN下拉；初始化保持模拟电源关闭</text>
<text x="35" y="625" font-size="18" fill="#1F4FD8">图注与自查要点</text>
<text x="35" y="655" font-size="14" fill="#556070">R29原1 MΩ下拉取消。抑制激励不等同精确零电流，开路/零点/切换恢复仍需验证。</text>
<text x="35" y="681" font-size="14" fill="#556070">VSET固定分压到IN+之间留可断开0 Ω与测试点；PA4仅预留，不直接并联此VSET。</text>
<text x="35" y="707" font-size="14" fill="#556070">当前工程没有台架中的VSET 100 pF、Q2 G对地1 nF；不能未核验证就直接补入。</text>
<text x="35" y="733" font-size="14" fill="#556070">有限合规电压限制最大可测电阻；不能把600 kΩ当作约8 µA下的恒流量程。</text>
<text x="35" y="759" font-size="14" fill="#556070">图省略去耦与供电脚：原U13去耦保留；实际原理图/封装脚序由用户最终核对。</text>
</svg>
