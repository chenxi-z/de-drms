<rect x="35" y="485" width="1030" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="511" font-size="15" fill="#1a1a1a">测量→参考：抑制激励，PB2置1，再PB0置1；参考→测量：PB0置0，再PB2置0</text>
<text x="47" y="536" font-size="15" fill="#1a1a1a">切换/建立期间标记数据无效；两条回流断开不是已验证的有效零点模式</text>
