<text x="587" y="191" font-size="15" fill="#1a1a1a">测量0/0；参考1/1；过渡1/0；禁止0/1</text>
<text x="587" y="216" font-size="15" fill="#1a1a1a">状态顺序为PB2/PB0，器件真值表待最终核验</text>
