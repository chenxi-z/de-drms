<text x="35" y="742" font-size="14" fill="#556070">不把F对地100 pF台架电容画成已安装；其存在会改变交流参考阻抗。</text>
<text x="35" y="768" font-size="14" fill="#556070">R32/R33：四线不贴、二线可贴0 Ω。采样参考地不加运放，不与数字回流共用细线。</text>
