<line x1="120" y1="470" x2="120" y2="500" class="w"/>
<text x="190" y="329" font-size="10" fill="#2563eb">PC0 VBAT_MON</text>
<text x="190" y="343" font-size="9" fill="#94a3b8">(2x1MOhm 分压)</text>
<text x="190" y="235" font-size="9" fill="#64748b">ISET: PB4</text>
<text x="190" y="535" font-size="9" fill="#64748b">EN: PB15</text>

<!-- ===== MCU ===== -->
<rect x="260" y="100" width="240" height="470" rx="2" fill="#f8fafc" stroke="#374151" stroke-width="2.5"/>
<text x="380" y="130" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">STM32U545RET6Q</text>
<text x="380" y="150" font-size="10" fill="#64748b" text-anchor="middle">Cortex-M33 160 MHz · 512 KB Flash</text>
<text x="380" y="165" font-size="10" fill="#64748b" text-anchor="middle">274 KB SRAM · LQFP-64</text>
