<text x="485" y="349" font-size="9" fill="#64748b" text-anchor="end">PB10 / PB15</text>

<!-- ===== digital peripherals ===== -->
<rect x="580" y="120" width="200" height="150" rx="2" fill="#eff6ff" stroke="#374151" stroke-width="2"/>
<text x="680" y="148" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">ADS131A02</text>
<text x="680" y="172" font-size="10" fill="#64748b" text-anchor="middle">24-bit SigmaDelta · 128 kSPS</text>
<text x="680" y="192" font-size="10" fill="#059669" text-anchor="middle">2-ch sync · AVDD -&gt; 3.3V_A</text>
<text x="680" y="212" font-size="10" fill="#64748b" text-anchor="middle">IOVDD -&gt; 3.3V_D · 内部 2.442 V</text>
<text x="680" y="232" font-size="10" fill="#2563eb" text-anchor="middle">动态范围 119.5 dB @1kSPS</text>
<rect x="580" y="290" width="200" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="680" y="318" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">TMP117</text>
<text x="680" y="340" font-size="10" fill="#64748b" text-anchor="middle">外置 4 线探头 · I2C1 · 4.7 kOhm 上拉</text>
<rect x="580" y="390" width="200" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="680" y="418" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">USB OTG FS</text>
<text x="680" y="440" font-size="10" fill="#64748b" text-anchor="middle">Type-C 数据 -&gt; 上位机</text>
<rect x="260" y="600" width="240" height="50" rx="2" fill="#f1f5f9" stroke="#374151" stroke-width="1.5"/>
<text x="380" y="620" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">SWD 调试口</text>
<text x="380" y="638" font-size="9" fill="#64748b" text-anchor="middle">6P 排针 · PA13/14 · PB3</text>

<!-- ===== analog frontend ===== -->
<rect x="860" y="120" width="180" height="80" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="950" y="145" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">3x OPA388 跟随器</text>
<text x="950" y="168" font-size="10" fill="#059669" text-anchor="middle">T/M/B · -&gt; 3.3V_A</text>
<text x="950" y="185" font-size="9" fill="#64748b" text-anchor="middle">Iq 1.7-2.6 mA 每颗</text>
<rect x="860" y="230" width="180" height="80" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="950" y="258" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">恒流源 OPA333+BSS138</text>
<text x="950" y="278" font-size="10" fill="#059669" text-anchor="middle">8 uA · Rsense 150 kOhm</text>
<text x="950" y="293" font-size="9" fill="#64748b" text-anchor="middle">CURR_DIS=1 关断（零点模式）</text>
<rect x="860" y="340" width="180" height="80" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
<text x="950" y="365" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">TMUX110x x4</text>
<text x="950" y="388" font-size="10" fill="#059669" text-anchor="middle">K1/K2/K3/K4 · -&gt; 3.3V_A</text>
<text x="950" y="405" font-size="9" fill="#64748b" text-anchor="middle">漏电 &lt;= 50 pA@25C</text>

