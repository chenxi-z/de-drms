<text x="120" y="128" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">USB Type-C</text>
<text x="120" y="149" font-size="10" fill="#64748b" text-anchor="middle">5V VBUS</text>
<rect x="60" y="200" width="120" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="120" y="228" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">BQ24040</text>
<text x="120" y="249" font-size="10" fill="#64748b" text-anchor="middle">充电管理</text>
<rect x="60" y="300" width="120" height="70" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
<text x="120" y="328" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">1S 锂电</text>
<text x="120" y="349" font-size="10" fill="#64748b" text-anchor="middle">3.0-4.2 V</text>
<rect x="60" y="400" width="120" height="70" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="120" y="428" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">TPS7A0233</text>
<text x="120" y="449" font-size="10" fill="#64748b" text-anchor="middle">3.3V_D 常开</text>
<rect x="60" y="500" width="120" height="70" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="120" y="528" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">TPS7A2033</text>
<text x="120" y="549" font-size="10" fill="#64748b" text-anchor="middle">3.3V_A EN受控</text>
<line x1="120" y1="170" x2="120" y2="200" class="w"/>
<line x1="120" y1="270" x2="120" y2="300" class="w"/>
