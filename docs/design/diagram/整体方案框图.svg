<text x="35" y="70" font-size="14" fill="#556070">首版直流测量工程验证 · 扫频为扩展预留，不承诺仅改固件即可实现</text>
<rect x="35" y="140" width="285" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="166" font-size="15" fill="#1a1a1a">样品：两电极，优选四线引出</text>
<text x="47" y="191" font-size="15" fill="#1a1a1a">客户 R0 约 10–20 kΩ</text>
<text x="47" y="216" font-size="15" fill="#1a1a1a">最大电阻与爆炸动态需求待定</text>
<rect x="400" y="140" width="290" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="412" y="166" font-size="15" fill="#1a1a1a">OPA333 + BSS138 低边恒流</text>
<text x="412" y="191" font-size="15" fill="#1a1a1a">固定分压，约 7.857 µA</text>
<text x="412" y="216" font-size="15" fill="#1a1a1a">Rsense 150 kΩ；TMUX1134校准</text>
<line class="w" x1="320" y1="185" x2="400" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="770" y="140" width="295" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="782" y="166" font-size="15" fill="#1a1a1a">三颗 OPA388 缓冲</text>
<text x="782" y="191" font-size="15" fill="#1a1a1a">T2 AAF候选，保留失败项</text>
<text x="782" y="216" font-size="15" fill="#1a1a1a">ADS131A02 双通道同步</text>
<line class="w" x1="690" y1="185" x2="770" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="770" y="340" width="295" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="782" y="366" font-size="15" fill="#1a1a1a">STM32U545RET6Q</text>
<text x="782" y="391" font-size="15" fill="#1a1a1a">SPI1；CS=PA8</text>
<text x="782" y="416" font-size="15" fill="#1a1a1a">采集/DMA/校准应用待完成</text>
<line class="w" x1="920" y1="240" x2="920" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="400" y="340" width="290" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="412" y="366" font-size="15" fill="#1a1a1a">TF：SDMMC1 4-bit</text>
<text x="412" y="391" font-size="15" fill="#1a1a1a">全量记录目标</text>
<text x="412" y="416" font-size="15" fill="#1a1a1a">持续吞吐/停顿与恢复待测</text>
<line class="w" x1="770" y1="390" x2="690" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="340" width="285" height="100" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="366" font-size="15" fill="#1a1a1a">USB FS：控制与降采样显示</text>
<text x="47" y="391" font-size="15" fill="#1a1a1a">PC13独立VBUS检测</text>
<text x="47" y="416" font-size="15" fill="#1a1a1a">电源状态机与取电策略待完成</text>
<line class="w" x1="920" y1="440" x2="920" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="920" y1="490" x2="170" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
<line class="w" x1="170" y1="490" x2="170" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="35" y="530" width="1030" height="75" rx="3" fill="#f8fafc" stroke="#1F4FD8"/>
<text x="47" y="556" font-size="15" fill="#1a1a1a">PA4 预留 DAC；VSET / AGND 测试点和可断开固定分压连接</text>
<text x="47" y="581" font-size="15" fill="#1a1a1a">未来：直流偏置 + 小正弦 → 实测电压/电流相量之比 → 复阻抗/CPE模型辨识</text>
<text x="35" y="670" font-size="18" fill="#1F4FD8">图注与自查要点</text>
<text x="35" y="700" font-size="14" fill="#556070">本版无TMP117、无TF电源开关；不能沿用旧低待机功耗预算。</text>
<text x="35" y="726" font-size="14" fill="#556070">128 kSPS仅双通道6字节原码已768 kB/s；12字节记录1.536 MB/s，USB FS不承诺全量。</text>
<text x="35" y="752" font-size="14" fill="#556070">24 bit位宽不等于24 bit有效分辨率；旧准确度、量程与动态断言须重新验证。</text>
<text x="35" y="778" font-size="14" fill="#556070">原理图/PCB由用户修改；本图与主文档附录F描述目标，不表示远端EDA已完成。</text>
</svg>
