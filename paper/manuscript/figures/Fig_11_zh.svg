<text x="700" y="420" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="21" fill="#111827">缓冲器位于梯形之前；两通道独立；传感电阻改变源幅值。</text>
<text x="700" y="465" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="21" fill="#111827">负载与探头在输出平面计入；跨接电容另用耦合节点模型。</text>
<text x="700" y="555" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#2563eb">分别评估差分输出与校准后的电阻比值。</text>
